<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forgot Password</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/registerform.css">
    <link rel="icon" type="icon" href="Icon.jpg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>
<body style="background-image: url(0000.jpg);">
    <div class="Wrapper">
        <form id="reset-password-form">
            <h1>Reset Your Password</h1>
            
            <!-- Email or Phone Number Input -->
            <div class="input-box">
                <input type="text" id="emailOrPhone" placeholder="Enter your Email or Phone Number" required>
            </div>

            <!-- Button to send OTP -->
            <button type="button" id="sendOtpBtn" class="button" onclick="sendOtp()">Send OTP</button>

            <!-- OTP Input (Initially hidden) -->
            <div class="input-box" id="otp-container" style="display: none;">
                <input type="text" id="otp" placeholder="Enter OTP" required>
            </div>

            <!-- New Password Inputs (Initially hidden) -->
            <div class="input-box" id="new-password-container" style="display: none;">
                <input type="password" id="newPassword" placeholder="Enter New Password" required>
            </div>
            <div class="input-box" id="confirm-password-container" style="display: none;">
                <input type="password" id="confirmPassword" placeholder="Re-enter New Password" required>
            </div>

            <!-- Final Submit Button (Initially hidden) -->
            <button type="submit" id="submitBtn" class="button" style="display: none;">Submit</button>
        </form>
    </div>

    <script>
        let userEmailOrPhone = ''; // To store email or phone for subsequent API calls
    
        // Function to send OTP
        async function sendOtp() {
            const emailOrPhone = document.getElementById('emailOrPhone').value.trim();
            if (!emailOrPhone) {
                alert("Please enter an email or phone number");
                return;
            }
    
            userEmailOrPhone = emailOrPhone;
    
            try {
                const response = await fetch('http://localhost:3000/api/request-otp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ emailOrPhone })
                });
    
                const result = await response.json();
    
                if (response.status === 200) {
                    alert(result.message);
    
                    // Show OTP and password fields, hide the send OTP button
                    document.getElementById('otp-container').style.display = 'block';
                    document.getElementById('new-password-container').style.display = 'block';
                    document.getElementById('confirm-password-container').style.display = 'block';
                    document.getElementById('submitBtn').style.display = 'block';
                    document.getElementById('sendOtpBtn').style.display = 'none';
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('Error sending OTP:', error);
                alert('Failed to send OTP. Please try again.');
            }
        }
    
        // Function to handle password reset
        const form = document.getElementById('reset-password-form');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
    
            const otp = document.getElementById('otp').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
    
            if (!otp || !newPassword || !confirmPassword) {
                alert("Please fill out all fields");
                return;
            }
    
            if (newPassword !== confirmPassword) {
                alert("Passwords do not match");
                return;
            }
    
            try {
                const response = await fetch('http://localhost:3000/api/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        emailOrPhone: userEmailOrPhone,
                        otp,
                        newPassword
                    })
                });
    
                const result = await response.json();
    
                if (response.status === 200) {
                    alert(result.message);
                    window.location.href = 'login.html'; // Redirect to login page
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('Error resetting password:', error);
                alert('Failed to reset password. Please try again.');
            }
        });
    </script>
    
</body>
</html>
