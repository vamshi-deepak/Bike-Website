<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" type="icon" href="Icon.jpg">
</head>
<body>
    <div class="Wrapper">
        <form id="loginForm">
            <h1>Login</h1>
            <div class="input-box">
                <input type="text" id="usernameOrEmail" placeholder="Username or Email" required>
            </div>

            <div class="input-box">
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <div class="remember-forgot">
                <input type="checkbox" id="rememberMe"><label for="rememberMe">Remember me</label>
                <a href="ForgotPass.html">Forgot password?</a>
            </div><br>

            <button type="submit" class="button">Login</button><br><br>
            <div class="Registerform">
                <p>Don't have an account?<a href="Registerform.html" style="color:white">Register here.</a></p><br>
                <a href="HomePage2.html" style="color:white">Skip & continue</a>
            </div>
        </form>
    </div>
    <script>
        let isLoggedIn = false;

        // Toggle the login/logout link
        function toggleLoginLogout() {
            const loginLogoutLink = document.getElementById('loginLogoutLink');
            const accountLink = document.getElementById('accountLink');

            if (isLoggedIn) {
                isLoggedIn = false;
                loginLogoutLink.textContent = 'Login';
                accountLink.style.display = 'none';  // Hide account link when logged out
            } else {
                isLoggedIn = true;
                loginLogoutLink.textContent = 'Logout';
                accountLink.style.display = 'block';  // Show account link when logged in
            }
        }

        // Call this function when the page loads to set the correct login/logout status
        window.onload = function() {
            const loginLogoutLink = document.getElementById('loginLogoutLink');
            if (isLoggedIn) {
                loginLogoutLink.textContent = 'Logout';
                document.getElementById('accountLink').style.display = 'block';
            } else {
                loginLogoutLink.textContent = 'Login';
                document.getElementById('accountLink').style.display = 'none';
            }
        };

        const form = document.getElementById('loginForm');
        form.addEventListener('submit', async (event) => {
            event.preventDefault(); // Prevent form submission

            const usernameOrEmail = document.getElementById('usernameOrEmail').value;
            const password = document.getElementById('password').value;

            if (!usernameOrEmail || !password) {
                alert('Please enter both username/email and password.');
                return;
            }

            const user = { usernameOrEmail, password };

            try {
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(user),
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Login successful');
                    localStorage.setItem('authToken', data.token); // Store the JWT token in localStorage
                    window.location.href = 'HomePage.html'; // Redirect to HomePage
                } else {
                    alert(data.message || 'Login failed. Please check your credentials.');
                }
            } catch (error) {
                console.error('Error during login request:', error);
                alert('An error occurred while logging in. Please try again.');
            }
        });
    </script>
</body>
</html>
